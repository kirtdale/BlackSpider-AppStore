<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Glass Ultra - BlackSpider Entertainment</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #070707;
    color: #ffffff;
}

header {
    background: #111;
    border-bottom: 2px solid #ff1744;
    padding: 18px 10%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: bold;
}

.brand img {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 8px;
}

.back {
    color: #ff1744;
    font-weight: bold;
    text-decoration: none;
}

.container {
    width: min(900px, 92%);
    margin: 70px auto;
}

.app-card {
    background: #121212;
    border: 1px solid #2c2c2c;
    border-radius: 18px;
    padding: 32px;
    display: flex;
    align-items: center;
    gap: 30px;
}

.app-image {
    width: 175px;
    height: 175px;
    border-radius: 20px;
    object-fit: cover;
}

.app-details h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.category {
    color: #aaa;
    margin-bottom: 15px;
}

.rating {
    color: #ffd600;
    font-size: 20px;
    margin-bottom: 22px;
}

.description {
    line-height: 1.6;
    margin-bottom: 24px;
}

.download-btn {
    display: inline-block;
    background: #ff1744;
    color: white;
    padding: 14px 26px;
    border-radius: 28px;
    text-decoration: none;
    font-weight: bold;
}

.download-btn:hover {
    background: #ff3d63;
}

.info {
    margin-top: 28px;
    background: #121212;
    border: 1px solid #2c2c2c;
    border-radius: 18px;
    padding: 28px;
}

.info h2 {
    margin-bottom: 20px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.info-box {
    background: #1b1b1b;
    border-radius: 14px;
    padding: 18px;
}

.info-box span {
    display: block;
    color: #999;
    font-size: 13px;
    margin-bottom: 6px;
}

@media (max-width: 700px) {
    .app-card {
        flex-direction: column;
        text-align: center;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="blackspider-logo.png" alt="BlackSpider">
        BlackSpider Entertainment
    </div>

    <a class="back" href="index.html">← Back to App Store</a>
</header>

<div class="container">

    <div class="app-card">

        <img class="app-image"
             src="skyglass-ultra.jpg"
             alt="Sky Glass Ultra">

        <div class="app-details">

            <h1>Sky Glass Ultra</h1>

            <div class="category">Entertainment</div>

            <div class="rating">★★★★★</div>

            <div class="description">
                Sky Glass Ultra is an entertainment application designed
                for compatible Android and Fire TV devices.
            </div>

            <a class="download-btn"
               href="https://github.com/kirtdale/BlackSpider-AppStore/releases/download/v1.9.95/Skyglass2_ultra.2.apk">
                Download Sky Glass Ultra
            </a>

        </div>
    </div>

    <div class="info">

        <h2>App Information</h2>

        <div class="info-grid">

            <div class="info-box">
                <span>Category</span>
                Entertainment
            </div>

            <div class="info-box">
                <span>Platform</span>
                Android / Fire TV
            </div>

            <div class="info-box">
                <span>File Size</span>
                36.1 MB
            </div>

        </div>
    </div>

</div>

</body>
</html>
